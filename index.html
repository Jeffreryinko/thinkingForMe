<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>thinkingForMe</title>
<meta name="description" content="내 생각·의견·사업구상을 심플부터 세세하게까지">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="gate" hidden></div>
<div id="app" hidden>
  <header class="bar">
    <span class="brand">thinkingForMe</span>
    <label class="depth"><span id="depthName"></span><input id="depth" type="range" min="1" max="5" step="1" aria-label="깊이: 단어부터 원문까지"></label>
    <button class="tb" data-act="search">찾기</button>
    <button class="tb" id="lockBtn" data-act="lock">잠금</button>
    <button class="tb" data-act="settings">설정</button>
  </header>
  <main id="main"></main>
  <form id="quick" autocomplete="off"><input id="quickIn" placeholder="지금 떠오른 생각을 한 줄로" maxlength="500" enterkeyhint="send"><button>적기</button></form>
  <nav class="tabs">
    <button data-go="home">오늘</button>
    <button data-go="map">지도</button>
    <button data-go="rel">연결</button>
    <button data-go="time">흐름</button>
    <button data-go="review">회고</button>
  </nav>
</div>
<div id="sheet" hidden><div class="sheet-bg" data-act="close"></div><div class="sheet-box" id="sheetBox"></div></div>
<div id="toasts" aria-live="polite"></div>
<noscript>자바스크립트가 켜져 있어야 동작합니다.</noscript>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
